<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Desktop</title>
</head>
<link rel="stylesheet" href="style.css">

<body>

    <div
        style="position: absolute; top: 0px; width: 100%; height: 40px; background-color: hwb(221 0% 54% / 0.292); display: flex; align-items: center; justify-content: space-between; padding: 0 16px; box-sizing: border-box;">
        <div id="clock" style="font-size: 20px;"></div>
        <div id="name" style="font-size: 20px; font-weight: bold;">WebOS3</div>
        <div id="Date" style="font-size: 20px;"></div>
    </div>

    <div
        style="position: absolute; top: 60px; left: 16px; width: 60px; height: 450px; background-color: hwb(271 81% 3% / 0.352); border-radius: 10px; display: flex; flex-direction: column; align-items: center; justify-content: space-evenly;">
        <div class="icon1" onclick="openWindow('App 1', 'app8.html')"
            style="width: 44px; height: 44px; background-color: hwb(0 100% 0% / 0.2); border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 9px; cursor: pointer;">
            <img src="icon8.png" style="width: 44px; height: 44px;">
        </div>
        <div class="settings" onclick="openWindow('Settings', 'camera.html')"
            style="width: 44px; height: 44px; background-color: hwb(0 100% 0% / 0.2); border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 9px; cursor: pointer;">
            <img src="camera.png" style="width: 44px; height: 44px;">
        </div>
        <div class="icon3" onclick="openWindow('App 3', 'app10.html')"
            style="width: 44px; height: 44px; background-color: hwb(0 100% 0% / 0.2); border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 9px; cursor: pointer;">
            <img src="icon7.png" style="width: 44px; height: 44px;">
        </div>
        <div class="icon4" onclick="openWindow('App 4', 'snake.html')"
            style="width: 44px; height: 44px; background-color: hwb(0 100% 0% / 0.2); border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 9px; cursor: pointer;">
            <img src="snake.png" style="width: 44px; height: 44px;">
        </div>
        <div class="icon5" onclick="openWindow('App 5', 'app5.html')"
            style="width: 44px; height: 44px; background-color: hwb(0 100% 0% / 0.2); border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 9px; cursor: pointer;">
            <img src="icon5.png" style="width: 44px; height: 44px;">
        </div>
    </div>

    </div>

    <script src="script.js"></script>
</body>

</html>
